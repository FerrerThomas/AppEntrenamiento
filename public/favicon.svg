<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5FF66"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#CCFF00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0A0A0A"/>
  <rect width="512" height="512" rx="128" fill="url(#glow)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#222225" stroke-width="4"/>

  <!-- Logo Emblem: Stylized F + Dumbbell -->
  <g filter="url(#shadow)">
    <!-- F Vertical Stem -->
    <path d="M140 120 C140 106.7 150.7 96 164 96 L290 96 C303.3 96 314 106.7 314 120 C314 133.3 303.3 144 290 144 L188 144 L188 220 L270 220 C283.3 220 294 230.7 294 244 C294 257.3 283.3 268 270 268 L188 268 L188 392 C188 405.3 177.3 416 164 416 C150.7 416 140 405.3 140 392 Z" fill="url(#neon)"/>

    <!-- Dumbbell Cross Dynamic Element -->
    <g transform="translate(320, 290) rotate(35)">
      <!-- Left plate -->
      <rect x="-18" y="-45" width="20" height="90" rx="8" fill="url(#neon)"/>
      <rect x="-32" y="-35" width="12" height="70" rx="5" fill="url(#neon)" opacity="0.85"/>
      <!-- Bar -->
      <rect x="2" y="-12" width="76" height="24" rx="6" fill="#FFFFFF"/>
      <!-- Right plate -->
      <rect x="78" y="-45" width="20" height="90" rx="8" fill="url(#neon)"/>
      <rect x="100" y="-35" width="12" height="70" rx="5" fill="url(#neon)" opacity="0.85"/>
    </g>
  </g>
</svg>